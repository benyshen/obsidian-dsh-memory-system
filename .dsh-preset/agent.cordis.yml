# The `aimemory` agent preset: a deliberately minimal long-term-memory agent.
#
# Tools kept to the bare essentials for memory work:
#   - tool-fs          read/write/edit files inside the AImemory memory vault
#   - tool-fs-search   search/glob inside the vault
#   - tool-ask-user    ask before capturing key ideas, big edits, etc.
#   - aimemory-notes   dedicated note tools: note_recall (unified ranked search
#                      over notes + memory), note_search (tag filtering),
#                      note_create (refuses overwrite), note_links (backlinks)
#                      (applied by aimemory-memory below, which always updates)
# Everything else (shell, web, subagents, workflows, goals, todo, ...) is
# deliberately NOT mounted in this preset.
#
# This file is an AGENT-PLANE composition. The roster mounts it once under a
# standing scope; every session naming it joins by scope parentage.

# ── identity ────────────────────────────────────────────────────────────────

# The deployment persona is shadowed for this agent. We do NOT use
# `complete: true` because the aimemory-memory plugin below appends its
# per-request memory section during system-prompt assembly, and a complete
# persona would discard every other section.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the user's long-term memory assistant, powered by the
      {{model}} model. Your working directory is the AImemory memory vault:
      {{cwd}}.

      You are a thinking-and-writing partner that keeps a durable,
      cross-session memory so future conversations start from where the last
      one ended. Read existing memory files before answering, keep the user's
      stable preferences and terminology, surface key ideas worth capturing,
      and maintain the layered memory under `.deepseek/` (profile / topics /
      records / episodes / inbox) plus the memo lifecycle, exactly per the
      protocol in AGENTS.md at the vault root. You may only read and modify
      files inside the vault through the provided file tools. Never invent
      facts about the user's notes or memory; read first.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── minimal tools ───────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# Asking the user is part of the key-idea capture contract: propose first,
# write to the memo only after consent (or an explicit standing consent).
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── cross-session memory injection + dedicated note tools ────────────────────

# Local plugin: reads the vault's `.deepseek/memory/*` and `.deepseek/inbox/*`
# plus a cached index distilled from this machine's past dsh sessions, and
# appends one bounded memory section to every system prompt of this agent.
#
# It also applies ./aimemory-notes.mjs on the same context. Because this
# plugin's code is always refreshed on upgrade (while this YAML preserves user
# edits), composing the note tools from here is what lets existing
# installations pick up note_search / note_create / note_links automatically.
- id: aimemory-memory
  name: ./aimemory-memory.mjs
  config:
    # 留空 = 路径无关：vault 自动取会话 cwd，sessions 自动取 $DSH_HOME/sessions。
    # 也可用 DSH_AIMEMORY_VAULT / DSH_SESSIONS_ROOT 环境变量覆盖。
    vaultRoot: ''
    sessionsRoot: ''
    maxHistoryEntries: 40
    maxHistoryChars: 8000
    cacheTtlMs: 0
    # 记忆体检（ISM 式确定性维护 pass）：扫描 records/templates 的
    # frontmatter 与 hook 字段，每日最多一次（auditIntervalMs 毫秒），报告注入
    # 系统提示；同时把 note_recall 的命中统计（cache/retrieval-stats.json）
    # 回写进卡片的 hook.uses / hook.last_used（可关：auditMaintainHookStats: false）。
    auditEnabled: true
    auditIntervalMs: 86400000
    auditMaintainHookStats: true
    # 检索（S5）：系统提示只注入导航层（主题/记录/模板/事件索引 = “有什么”），
    # 相关内容按需用 note_recall 拉取，不再逐轮注入 top-k 召回。
    notes:
      # 留空 = 路径无关：vault 自动取会话 cwd 或 DSH_AIMEMORY_VAULT。
      vaultRoot: ''
      maxSearchResults: 50
      maxNoteBytes: 1048576
      excludePatterns: ['.obsidian', '.trash', '.git', 'node_modules']
