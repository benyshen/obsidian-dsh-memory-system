name: AImemory 长期记忆助手
description: 面向本地 AImemory 记忆库（vault，默认 $DSH_AIMEMORY_VAULT）的最小 agent：文件读写与搜索、专用笔记工具（note_recall 统一检索——笔记与记忆一次 BM25 排序 / note_search tag 过滤 / note_create 拒绝覆盖 / note_links 反链查询）、跨会话分层长期记忆（profile/topics/records/episodes/inbox 五层 + 备忘录生命周期）、每日记忆体检（ISM 式确定性维护）、关键想法捕获与备忘录提醒。记忆架构参考 dsh-obsidian-math，持续演进。
order: 1
